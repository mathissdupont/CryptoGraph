name: Analysis integrity regression tests

on:
  pull_request:
  push:
    branches:
      - fix/analysis-integrity-2026-10-27

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Run integrity regression tests
        run: python -m pytest tests/test_analysis_integrity.py -q
