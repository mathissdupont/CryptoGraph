name: Tests and package smoke check

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Run full regression suite
        run: python -m pytest -q
      - name: Verify frozen method and reserved candidate identities without evaluation
        run: python scripts/check-key-origin-freeze.py --snapshot-only

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel in an isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/cryptograph-env"
          "$RUNNER_TEMP/cryptograph-env/bin/python" -m pip install dist/*.whl
      - name: Scan outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          mkdir cryptograph-smoke
          cd cryptograph-smoke
          printf 'import hashlib\nhashlib.md5(b"example")\n' > example.py
          "$RUNNER_TEMP/cryptograph-env/bin/cryptograph" scan --input example.py --backend ast-lite --output cbom.json --report report.html
          "$RUNNER_TEMP/cryptograph-env/bin/python" -c 'import json; from pathlib import Path; data=json.loads(Path("cbom.json").read_text()); assert data["cryptographic_assets"]; assert Path("report.html").is_file(); assert len(list(Path("output").glob("run-*/manifest.json"))) == 1'

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,ui]'
      - run: python -m pytest tests/test_viewer.py -q

  exporter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -e '.[dev]'
      - name: Build bundled exporter
        run: docker build --target fraunhofer-exporter-builder -t cryptograph-exporter-check .
      - name: Extract built JAR
        run: |
          container=$(docker create cryptograph-exporter-check)
          docker cp "$container:/workspace/tools/fraunhofer-exporter/build/libs/fraunhofer-exporter.jar" "$RUNNER_TEMP/exporter.jar"
          docker rm "$container"
      - name: Run real Java exporter smoke tests
        env:
          CRYPTOGRAPH_TEST_EXPORTER: ${{ runner.temp }}/exporter.jar
        run: python -m pytest tests/test_exporter_integration.py -q

  cbomkit-comparator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Acquire pinned development source files
        run: python scripts/acquire-key-origin-corpus.py --fetch --root "$RUNNER_TEMP/cbomkit-sources"
      - name: Run pinned native inventory with an AES positive control
        run: python scripts/observe-cbomkit.py --pull --source-root "$RUNNER_TEMP/cbomkit-sources" --out-dir "$RUNNER_TEMP/cbomkit-observations"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cbomkit-native-development-observations
          path: ${{ runner.temp }}/cbomkit-observations

  python-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Python and JEP runtime
        run: docker build -t cryptograph-python-research .
      - name: Compare direct expression, source-only, AST and CPG development cells
        run: |
          mkdir -p "$RUNNER_TEMP/cryptograph-research"
          docker run --rm --network none -e CRYPTOGRAPH_DFG_DEPTH=12 --mount "type=bind,source=$RUNNER_TEMP/cryptograph-research,target=/results" --entrypoint python cryptograph-python-research scripts/run-key-origin-matrix.py --dfg-probe --out-dir /results/matrix --provisional-proposals research/python-key-origin/review-proposals.json
      - name: Acquire fingerprinted development project sources
        run: docker run --rm --mount "type=bind,source=$RUNNER_TEMP/cryptograph-research,target=/results" --entrypoint python cryptograph-python-research scripts/acquire-key-origin-corpus.py --fetch --root /results/project-sources
      - name: Check real Python DFG controls
        run: docker run --rm --network none -e CRYPTOGRAPH_DFG_DEPTH=12 -e CRYPTOGRAPH_TEST_PYTHON_CPG=1 --entrypoint python cryptograph-python-research -m pytest tests/test_python_dfg_integration.py -q -p no:cacheprovider
      - name: Observe real projects with AST and CPG
        run: |
          docker run --rm --network none --mount "type=bind,source=$RUNNER_TEMP/cryptograph-research,target=/results" --mount "type=bind,source=$RUNNER_TEMP/cryptograph-research/project-sources,target=/sources,readonly" --entrypoint python cryptograph-python-research scripts/run-project-key-origin.py --source-root /sources --backend ast-lite --out-dir /results/project-ast
          docker run --rm --network none -e CRYPTOGRAPH_DFG_DEPTH=12 --mount "type=bind,source=$RUNNER_TEMP/cryptograph-research,target=/results" --mount "type=bind,source=$RUNNER_TEMP/cryptograph-research/project-sources,target=/sources,readonly" --entrypoint python cryptograph-python-research scripts/run-project-key-origin.py --source-root /sources --backend fraunhofer-strict --dfg-probe --out-dir /results/project-cpg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-key-origin-development-observations
          path: |
            ${{ runner.temp }}/cryptograph-research/matrix
            ${{ runner.temp }}/cryptograph-research/project-ast
            ${{ runner.temp }}/cryptograph-research/project-cpg
